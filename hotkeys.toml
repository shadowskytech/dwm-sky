  { mod="SUPER CTRL",       key="q",       desc="Power menu",              func="spawn",       cmd="$HOME/.config/rofi/powermenu.sh" },
  { mod="SUPER CTRL SHIFT", key="r",       desc="Reboot",                  func="spawn",       cmd="systemctl reboot" },
  { mod="SUPER CTRL SHIFT", key="s",       desc="Suspend",                 func="spawn",       cmd="systemctl suspend" },
  { mod="SUPER CTRL SHIFT"           , key="l",       desc="slock",                   func="spawn",       cmd="slock" },

  # Pomodoro (bindings must live inside keys = [ ... ] — see file header)
  { mod="SUPER",     key="F8",      desc="Pomodoro start/stop",     func="spawn",       cmd="pomodoro toggle" },
  { mod="SUPER",     key="F9",      desc="Pomodoro pause/resume",   func="spawn",       cmd="pomodoro toggle-pause" },
  
  # compositor toggle
  {mod="SUPER",      key="F5",      desc="Toggle compositor",       func="spawn",       cmd="toggle-compositor"},

# additional apps/softwares/shortcuts
  { mod="SUPER SHIFT",  key="f",  desc="Firefox",   func="spawn",  exec=["firefox"] },
  { mod="SUPER SHIFT",  key="c",  desc="VS Codium", func="spawn",  exec=["codium"] },
  { mod="SUPER",        key="c",  desc="VS Code",   func="spawn",  exec=["code"] },
  { mod="SUPER SHIFT",  key="s",  desc="Screenshot",func="spawn",  cmd="scrot -s ~/Pictures/screenshot.png" },
  { mod="SUPER",        key="o", desc="Obsidian",    func="spawn", cmd="obsidian &" },
]

# ── TAG BINDINGS ──────────────────────────────────────────────────────────────
# Each entry auto-generates 4 bindings for that tag number:
#   SUPER + key                  → switch to tag
#   SUPER + CTRL + key           → also show this tag alongside current
#   SUPER + SHIFT + key          → send focused window to this tag
#   SUPER + CTRL + SHIFT + key   → also show window on that tag
#
# key = X11 key name    tag = 0-based index  (0 = tag 1,  8 = tag 9)

tag_keys = [
  { key="1", tag=0 },
  { key="2", tag=1 },
  { key="3", tag=2 },
  { key="4", tag=3 },
  { key="5", tag=4 },
  { key="6", tag=5 },
  { key="7", tag=6 },
  { key="8", tag=7 },
  { key="9", tag=8 },
]


# ── CUSTOM SHORTCUTS ──────────────────────────────────────────────────────────
# Add your own below.  Uncomment, fill in the fields, and save.
#

# ── MOUSE BUTTON BINDINGS ─────────────────────────────────────────────────────
#
# Each { ... } entry in the buttons array maps a mouse click to a dwm action.
#
#  click   Where the click happens:
#            ClkTagBar     → the tag/workspace bar
#            ClkLtSymbol   → the layout symbol in the bar
#            ClkStatusText → the status text (right side of bar)
#            ClkWinTitle   → the window title in the bar
#            ClkClientWin  → any client window
#            ClkRootWin    → the desktop (no windows)
#
#  mod     Optional modifier (same format as hotkeys): "SUPER", "SUPER SHIFT", etc.
#          Leave empty or omit for no modifier.
#
#  button  Mouse button number: 1=left  2=middle  3=right
#
#  func    Same functions as hotkeys.  For extra args: i=N, f=N, ui=N.
#
# ─────────────────────────────────────────────────────────────────────────────

buttons = [
  { click="ClkTagBar",    mod="SUPER",  button=1,  func="tag" },
  { click="ClkTagBar",    mod="SUPER",  button=3,  func="toggletag" },
  { click="ClkClientWin", mod="SUPER",  button=1,  func="moveorplace",  i=2 },
  { click="ClkClientWin", mod="SUPER",  button=3,  func="resizemouse" },
  { click="ClkTagBar",    mod="",       button=1,  func="view" },
  { click="ClkTagBar",    mod="",       button=3,  func="toggleview" },
]

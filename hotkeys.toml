  { mod="CTRL ALT",                 key="Down",   desc="Volume down",   func="spawn",  cmd="amixer sset Master 1%- unmute" },

  # ── Brightness ────────────────────────────────────────────────────────────────
  { mod="SUPER SHIFT",                 key="Up",    desc="Brightness +",  func="spawn",  cmd="brightnessctl set 10%+" },
  { mod="SUPER SHIFT",                 key="Down",  desc="Brightness -",  func="spawn",  cmd="brightnessctl set 10%-" },

  # precise brightnessctl
  { mod="CTRL SHIFT",                 key="Up",    desc="Brightness +",  func="spawn",  cmd="brightnessctl set 1%+" },
  { mod="CTRL SHIFT",                 key="Down",  desc="Brightness -",  func="spawn",  cmd="brightnessctl set 1%-" },

  # ── Window focus & movement ───────────────────────────────────────────────────

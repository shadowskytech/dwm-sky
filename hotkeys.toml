  { mod="SUPER CTRL",                 key="Down",   desc="Volume down",   func="spawn",  cmd="amixer sset Master 5%- unmute" },
  { mod="SUPER CTRL",                 key="m",          desc="Mute toggle",   func="spawn",  cmd="amixer sset Master toggle" },
  
   # media keys
  { mod="SUPER CTRL",                 key="k",   desc="play/pause",func="spawn",  cmd="playerctl play-pause" },
  { mod="SUPER CTRL",                 key="l",   desc="next",     func="spawn",  cmd="playerctl next" },
